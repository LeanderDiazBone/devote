defaults:

  seed: 0
  method: name
  task: dummy_disc
  logdir: ''
  eval_dir: ''
  filter: 'score|length|fps|ratio|train/.*_loss$|train/rand/.*/mean|train/love.*/.*'
  tensorboard_videos: False

  replay:
    size: 5e6
    online: True
    fracs: {uniform: 1.0, priority: 0.0, recency: 0.0}
    prio: {exponent: 0.8, maxfrac: 0.5, initial: inf, zero_on_sample: True}
    priosignal: model
    recexp: 1.0
    chunksize: 1024
    save_wait: False

  jax:
    platform: gpu
    jit: True
    compute_dtype: bfloat16
    param_dtype: float32
    prealloc: True
    checks: False
    logical_cpus: 0
    debug: False
    policy_devices: [0]
    train_devices: [0]
    sync_every: 1
    profiler: False
    transfer_guard: True
    assert_num_devices: -1
    fetch_policy_carry: False
    nvidia_flags: False
    xla_dump: False

  run:
    script: train
    steps: 1e10
    duration: 0
    num_envs: 16
    num_envs_eval: 4
    expl_until: 0
    expl_switches: {frequency_scale: 2, steps_scale: 0.1, steps_horizon: 64}
    log_every: 120
    save_every: 1000000
    eval_every: 180
    eval_initial: True
    eval_eps: 1
    train_ratio: 32.0
    train_fill: 0
    eval_fill: 0
    log_zeros: True
    log_keys_video: [image]
    log_keys_sum: '^$'
    log_keys_avg: '^$'
    log_keys_max: '^$'
    log_video_fps: 20
    log_video_streams: 4
    log_episode_timeout: 60
    from_checkpoint: ''
    actor_addr: 'tcp://localhost:{auto}'
    replay_addr: 'tcp://localhost:{auto}'
    logger_addr: 'tcp://localhost:{auto}'
    actor_batch: 8
    actor_threads: 4
    env_replica: -1
    ipv6: False
    usage: {psutil: True, nvsmi: True, gputil: False, malloc: False, gc: False}
    timer: True
    driver_parallel: True
    agent_process: False
    remote_replay: False
    eval_trajectory_dir: False
    explore_trajectory_dir: False

  wrapper: {length: 0, reset: True, discretize: 0, checks: True, action_cost: 0.1, use_tolerance_reward: False}
  env:
    atari: {size: [64, 64], repeat: 4, sticky: True, gray: True, actions: all, lives: unused, noops: 0,
            autostart: False, pooling: 2, aggregate: max, resize: pillow, use_seed: True}
    crafter: {size: [64, 64], logs: False, use_logdir: False}
    atari100k: {size: [64, 64], repeat: 4, sticky: False, gray: False, actions: all,
                lives: unused, noops: 0, autostart: False, resize: pillow, length: 100000}
    dmlab: {size: [64, 64], repeat: 4, episodic: True, actions: popart, use_seed: False}
    minecraft: {size: [64, 64], break_speed: 100.0, logs: False}
    dmc: {size: [64, 64], repeat: 2, image: True, camera: -1, use_seed: True}
    procgen: {size: [64, 64]}
    loconav: {size: [64, 64], repeat: 2, camera: -1}
    humanoid: {obs_key: vector, policy_path: "", mean_path: "", var_path: "", policy_type: "", small_obs: "",
                is_eval: False, actuation: position, reward_dict: {hand_dist: 0.1,
                                                                   target_dist: 0.1, success: 10, terminate: False}}

  # Agent
  report: True
  report_gradnorms: False
  batch_size: 16
  batch_length: 65
  batch_length_eval: 33
  replay_length: 0
  replay_length_eval: 0
  replay_context: 1
  random_agent: False
  loss_scales: {dec_cnn: 1.0, dec_mlp: 1.0, reward: 1.0, cont: 1.0, dyn: 1.0, rep: 0.1, actor: 1.0, critic: 1.0,
                replay_critic: 0.3, int_rew_model: 1.0, expl_critic: 1.0, temp: 1.0, exp_actor: 1.0,
                love_dyn_ensemble: 1.0, love_critic_ensemble: 1.0}
  opt: {scaler: rms, lr: 4e-5, eps: 1e-20, momentum: True, wd: 0.0, warmup: 1000, globclip: 0.0, agc: 0.3, beta1: 0.9,
        beta2: 0.999, details: False, pmin: 1e-3, anneal: 0, schedule: constant}
  separate_lrs: False
  lrs: {dec: 1e-4, enc: 1e-4, dyn: 1e-4, int_rew_model: 1e-4, rew: 1e-4, con: 1e-4, actor: 3e-5, critic: 3e-5,
        expl_critic: 3e-5, temp: 1e-4}
  ac_grads: none
  reset_context: 0.0
  replay_critic_loss: True
  replay_critic_grad: True
  replay_critic_bootstrap: imag
  reward_grad: True
  report_openl_context: 8

  # World Model
  dyn:
    typ: rssm
    rssm: {deter: 8192, hidden: 1024, stoch: 32, classes: 64, act: silu, norm: rms, unimix: 0.01, outscale: 1.0,
           winit: normal, imglayers: 2, obslayers: 1, dynlayers: 1, absolute: False, cell: blockgru, blocks: 8,
           block_fans: False, block_norm: False}
  enc:
    spaces: '.*'
    typ: simple
    simple: {depth: 64, mults: [1, 2, 3, 4, 4], layers: 3, units: 1024, act: silu, norm: rms, winit: normal,
             symlog: True, outer: True, kernel: 5, minres: 4}
  dec:
    spaces: '.*'
    typ: simple
    simple: {inputs: [deter, stoch], vecdist: symlog_mse, depth: 64, mults: [1, 2, 3, 4, 4], layers: 3,
             units: 1024, act: silu, norm: rms, outscale: 1.0, winit: normal, outer: True, kernel: 5, minres: 4,
             block_space: 8, block_fans: False, block_norm: False, hidden_stoch: True, space_hidden: 0}
  rewhead: {layers: 1, units: 1024, act: silu, norm: rms, dist: symexp_twohot, outscale: 0.0,
            inputs: [deter, stoch], winit: normal, bins: 255, block_fans: False, block_norm: False}
  conhead: {layers: 1, units: 1024, act: silu, norm: rms, dist: binary, outscale: 1.0,
            inputs: [deter, stoch], winit: normal, block_fans: False, block_norm: False}
  contdisc: True
  rssm_loss: {free: 1.0}

  # Ensemble models
  int_rew_model:
    num_heads: 5
    disg_agg: sum
    pooling_output: 32
    use_entropy: False
    expl_rew_weights: {obs: 1.0, dyn: 1.0, rew: 1.0}
    model: {layers: 2, units: 256, act: silu, norm: rms,
            dist: {obs: symlog_mse, dyn: onehot, rew: symlog_mse},
            normalization_impl: {obs: mean_std, dyn: off, rew: mean_std},
            unimix: 0.0, outscale: 1.0,
            inputs: [deter, stoch], winit: normal, bins: 255, block_fans: False, block_norm: False}

  # Actor Critic
  actor: {layers: 3, units: 1024, act: silu, norm: rms, minstd: 0.1, maxstd: 1.0, outscale: 0.01,
          unimix: 0.01, inputs: [deter, stoch], winit: normal, block_fans: False, block_norm: False}
  critic: {layers: 3, units: 1024, act: silu, norm: rms, dist: symexp_twohot, outscale: 0.0,
           inputs: [deter, stoch], winit: normal, bins: 255, block_fans: False, block_norm: False}
  critic_prior: {layers: 0, units: 0, outscale: 1.0, dist: mse, action_independent: False}  # 0 means inherit from critic
  actor_dist_disc: onehot
  actor_dist_cont: normal
  imag_start: all
  imag_repeat: 1
  imag_length: 15
  imag_unroll: False
  horizon: 333
  return_lambda: 0.95
  return_lambda_replay: 0.95
  slow_critic_update: 1
  slow_critic_fraction: 0.02
  slow_actor_fraction: 0.02
  slow_actor_update: 1
  retnorm: {impl: perc, rate: 0.01, limit: 1.0, perclo: 5.0, perchi: 95.0}
  valnorm: {impl: off, rate: 0.01, limit: 1e-8}
  advnorm: {impl: off, rate: 0.01, limit: 1e-8}
  actent: 3e-4
  slowreg: 1.0
  slowtar: False
  temp: {init_temp: 1.0, min_temp: 1e-8, max_temp: 1e8, slope: 1e-8,
         constraint_weight: 1.0, temp_wd: 0.1}
  
  # NEW PARAMETERS
  num_value_heads: 5
  bootstrap_type: bernoulli
  val_unc_coef: 1.0
  imag_critic_loss: 1
  p_mask: 1.0
  use_intrinsic_reward: 1.0
  exp_obj: ucb                    # ucb | sombrl | ocb | none
  use_imag_critic_loss: 1.0
  value_prior_scale: 1.0
  reward_prior_scale: 1.0

  # LOVE-specific
  love:
    dyn_heads: 5
    value_heads: 5
    actor_heads: 5
    dyn_bootstrap_prob: 1.0
    dyn_bonus_scale: 1.0
    value_bonus_scale: 1.0
    dyn_uncertainty_feature: deter
    train_dyn_ensemble: True
    train_value_ensemble: True
    exp_use_dyn_bonus: True

  # SAC-specific
  sac:
    policy_mode: actor      # actor | exp_actor
    num_heads: 2
    boot_prob: 1.0
    target_mode: min        # min | random_min | individual
    random_target_k: 2
    use_prior: 0
    value_prior_scale: 1.0
    reward_prior_scale: 1.0
    target_entropy_scale: 0.98
    init_alpha: 0.1


size12m: &size12m
  dyn.rssm: {deter: 2048, hidden: 256, classes: 16}
  .*\.depth: 16
  .*\.units: 256
  int_rew_model: {num_heads: 5, model: { layers: 2, units: 256 },
                  pooling_output: 64}

size25m: &size25m
  dyn.rssm: {deter: 3072, hidden: 384, classes: 24}
  .*\.depth: 24
  .*\.units: 384
  int_rew_model: {num_heads: 5, model: { layers: 2, units: 256},
                   pooling_output: 64}

size50m: &size50m
  dyn.rssm: {deter: 4096, hidden: 512, classes: 32}
  .*\.depth: 32
  .*\.units: 512
  int_rew_model: { num_heads: 5,
                   model: { layers: 2, units: 256},
                   pooling_output: 64 }

size100m: &size100m
  dyn.rssm: {deter: 6144, hidden: 768, classes: 48}
  .*\.depth: 48
  .*\.units: 768
  int_rew_model: { num_heads: 5,
                   model: { layers: 2, units: 256},
                   pooling_output: 64 }

size200m: &size200m
  dyn.rssm: {deter: 8192, hidden: 1024, classes: 64}
  .*\.depth: 64
  .*\.units: 1024
  int_rew_model: { num_heads: 5,
                   model: { layers: 2, units: 1024},
                   pooling_output: 64}

size400m: &size400m
  dyn.rssm: {deter: 12288, hidden: 1536, classes: 96}
  .*\.depth: 96
  .*\.units: 1536
  int_rew_model: { num_heads: 5, model: { layers: 2, units: 1024},
                   pooling_output: 64 }

atari:
  <<: *size12m
  task: atari_pong
  env.atari.size: [96, 96]
  (enc|dec).simple.minres: 6
  run:
    steps: 5.1e7
  enc.spaces: 'image'
  dec.spaces: 'image'

procgen:
  <<: *size12m
  task: procgen_coinrun
  env.procgen.size: [96, 96]
  (enc|dec).simple.minres: 6
  run:
    steps: 1.1e8
    train_ratio: 64
  enc.spaces: 'image'
  dec.spaces: 'image'

crafter:
  <<: *size12m
  task: crafter_reward
  run:
    num_envs: 1
    log_keys_max: '^log_achievement_.*'
    log_keys_sum: '^log_reward$'
    log_video_fps: 10
    train_ratio: 512
    steps: 1.1e6
  enc.spaces: 'image'
  dec.spaces: 'image'

pinpad:
  <<: *size12m
  task: pinpad_three
  run.num_envs: 1
  run.train_ratio: 64
  run.save_every: -1

bsuite:
  <<: *size12m
  task: bsuite_mnist/0
  run.num_envs: 1
  run.train_ratio: 1024
  run.save_every: -1

dmc_vision:
  <<: *size12m
  task: dmc_walker_walk
  run.train_ratio: 512
  run.steps: 6e5
  enc.spaces: 'image'
  dec.spaces: 'image'

dmc_proprio:
  <<: *size12m
  task: dmc_walker_walk
  run.train_ratio: 512
  run.steps: 3e5
  env.dmc.image: False

loconav:
  task: loconav_ant_maze_m
  env.loconav.repeat: 1
  run:
    train_ratio: 256
    log_keys_max: '^log_.*'

memmaze:
  task: memmaze_11x11
  enc.spaces: 'image'
  dec.spaces: 'image'

humanoid_proprio:
  task: humanoid_Pushing-v0
  run:
    script: train_eval
    log_every: 30  # Seconds
    eval_every: 100000  # Steps
    train_ratio: 512
  rssm.deter: 512
  .*\.cnn_depth: 32
  .*\.layers: 2
  .*\.units: 512
  encoder: {mlp_keys: '.*', cnn_keys: '$^'}
  decoder: {mlp_keys: '.*', cnn_keys: '$^'}

humanoid_vision:
  task: humanoid_Pushing-v0
  run:
    log_every: 30  # Seconds
    eval_every: 500000  # Steps
    train_ratio: 512
  rssm.deter: 512
  .*\.cnn_depth: 32
  .*\.layers: 2
  .*\.units: 512
  encoder: {mlp_keys: '.*', cnn_keys: 'image'}
  decoder: {mlp_keys: '.*', cnn_keys: 'image'}

humanoid_benchmark:
  task: humanoid_Pushing-v0
  rssm.deter: 1024
  .*\.cnn_depth: 48
  .*\.units: 640
  .*\.layers: 3
  run:
    script: train_eval
    eval_every: 500000  # Steps
    train_ratio: 64
    log_every: 30 # Seconds
  batch_size: 16
  encoder: {mlp_keys: '.*', cnn_keys: '$^'}
  decoder: {mlp_keys: '.*', cnn_keys: '$^'}

minecraft:
  <<: *size12m
  task: minecraft_diamond
  run:
    log_keys_max: '^log_inventory.*'
  enc.spaces: 'image|inventory|inventory_max|equipped|health|hunger|breath'
  dec.spaces: 'image|inventory|inventory_max|equipped|health|hunger|breath'

dmlab:
  <<: *size12m
  task: dmlab_explore_goal_locations_small
  enc.spaces: 'image|instr'
  dec.spaces: 'image|instr'
  run:
    steps: 2.6e7

atari100k:
  <<: *size12m
  task: atari_pong
  run:
    steps: 1.1e5
    num_envs: 1
    train_ratio: 256
  enc.spaces: 'image'
  dec.spaces: 'image'

multicpu:
  jax:
    logical_cpus: 8
    policy_devices: [0, 1]
    train_devices: [2, 3, 4, 5, 6, 7]
  run:
    num_envs: 8
    actor_batch: 4
  batch_size: 12

debug:
  jax: {debug: True, jit: True, prealloc: False, platform: cpu, compute_dtype: bfloat16, profiler: False, checks: False}
  wrapper: {length: 100, checks: True, action_cost: 0.1}
  run: {num_envs: 4, eval_every: 10, log_every: 5, save_every: 15, train_ratio: 8,
        actor_batch: 2, driver_parallel: False}
  report_gradnorms: True
  batch_size: 4
  batch_length: 12
  batch_length_eval: 12
  replay.size: 1e4
  (rewhead|critic).bins: 9
  dyn.rssm: {deter: 12, hidden: 8, stoch: 4, classes: 4, blocks: 4}
  .*\.layers: 2
  .*\.units: 8
  .*\.depth: 2
  int_rew_model: {num_heads: 2, .*\.layers: 2, .*\.units: 8, pooling_output: 2}
